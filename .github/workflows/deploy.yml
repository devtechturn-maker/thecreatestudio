# Auto-deploy to the production server on every push to master.
# Required GitHub secrets (repo → Settings → Secrets and variables → Actions):
#   SSH_HOST         server IP, e.g. 187.127.180.221
#   SSH_USER         e.g. root
#   SSH_PRIVATE_KEY  private key whose public key is in the server's ~/.ssh/authorized_keys
#   SSH_PORT         optional, defaults to 22

name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch: # allows a manual "Run workflow" button in the Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/thecreatestudio
            git checkout -- .
            git pull origin master
            if [ -f /root/.web3forms_key ]; then
              sed -i "s/WEB3FORMS_ACCESS_KEY/$(cat /root/.web3forms_key)/" src/environments/environment.ts
            fi
            npm install --no-audit --no-fund
            npm run build
            rm -rf /var/www/thecreatestudio/*
            cp -r dist/TheCreateStudio/browser/* /var/www/thecreatestudio/
            chown -R www-data:www-data /var/www/thecreatestudio
            echo "Deployed: $(git log -1 --oneline)"
