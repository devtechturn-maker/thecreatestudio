# Auto-deploy to the production server on every push to master.
# Required GitHub secrets (repo → Settings → Secrets and variables → Actions):
#   SSH_HOST         server IP, e.g. 187.127.180.221
#   SSH_USER         e.g. root
#   SSH_PRIVATE_KEY  private key whose public key is in the server's ~/.ssh/authorized_keys
#   SSH_PORT         optional, defaults to 22

name: Deploy to production

on:
  push:
    branches: [master]
  workflow_dispatch: # allows a manual "Run workflow" button in the Actions tab

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd /opt/thecreatestudio
            git checkout -- .
            git pull origin master
            if [ -f /root/.web3forms_key ]; then
              sed -i "s/WEB3FORMS_ACCESS_KEY/$(cat /root/.web3forms_key)/" src/environments/environment.ts
            fi

            # ---- Backend (Spring Boot) — only once the server is set up for it
            #      (Java installed and the systemd service file present). Built and
            #      tested BEFORE anything live is replaced.
            # Always build with Java 21, even if the server's default "java" is another version.
            JAVA21=$(ls -d /usr/lib/jvm/java-21-openjdk-* 2>/dev/null | head -1)
            BACKEND=0
            if [ -n "$JAVA21" ] && [ -x "$JAVA21/bin/javac" ] && [ -f /etc/systemd/system/thecreatestudio-backend.service ]; then
              BACKEND=1
              (cd backend && chmod +x mvnw && JAVA_HOME="$JAVA21" PATH="$JAVA21/bin:$PATH" ./mvnw -q -B clean package) # clean: deleted classes must not survive into the jar
            elif [ -f /etc/systemd/system/thecreatestudio-backend.service ]; then
              echo "Java 21 JDK not found. Run: apt install -y openjdk-21-jdk-headless"; exit 1
            else
              echo "Backend not set up on this server yet — skipping backend deploy."
            fi

            # ---- Frontend (Angular)
            npm install --no-audit --no-fund
            npm run build

            # ---- Go live (only reached if every build above succeeded)
            if [ "$BACKEND" = "1" ]; then
              # Keep the installed systemd unit in sync with the repo (e.g. Java 21 path).
              if ! cmp -s deploy/thecreatestudio-backend.service /etc/systemd/system/thecreatestudio-backend.service; then
                cp deploy/thecreatestudio-backend.service /etc/systemd/system/thecreatestudio-backend.service
                systemctl daemon-reload
              fi
              cp backend/target/backend-*.jar /opt/thecreatestudio-backend/app.jar
              chown tcs:tcs /opt/thecreatestudio-backend/app.jar
              systemctl restart thecreatestudio-backend
              for i in $(seq 1 60); do
                curl -fs http://127.0.0.1:8095/actuator/health >/dev/null && break
                sleep 2
              done
              curl -fs http://127.0.0.1:8095/actuator/health >/dev/null || { echo "Backend failed to start"; journalctl -u thecreatestudio-backend -n 50 --no-pager; exit 1; }
              echo "Backend healthy."
            fi
            rm -rf /var/www/thecreatestudio/*
            cp -r dist/TheCreateStudio/browser/* /var/www/thecreatestudio/
            chown -R www-data:www-data /var/www/thecreatestudio
            echo "Deployed: $(git log -1 --oneline)"
