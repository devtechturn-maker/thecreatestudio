# nginx config for TheCreateStudio (Angular single-page app)
# Served on http://187.127.180.221:8091 (port 8090 is used by another site).
# Copy to /etc/nginx/sites-available/thecreatestudio

server {
    listen 8091;
    listen [::]:8091;
    server_name 187.127.180.221;

    root /var/www/thecreatestudio;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Hashed JS/CSS files never change -> cache for 1 year
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images -> cache for 30 days
    location ~* \.(?:svg|png|jpe?g|webp|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html must never be cached, so new deploys show immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: every route (/about, /contact, ...) serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
