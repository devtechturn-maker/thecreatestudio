# TheCreateStudio backend configuration.
# Every secret comes from an environment variable — nothing sensitive is stored here.
# Local development: copy application-local.yml.example to application-local.yml and
# run with SPRING_PROFILES_ACTIVE=local.

server:
  port: ${SERVER_PORT:8080}
  # nginx forwards the real client IP in X-Forwarded-For (needed for the signing audit trail)
  forward-headers-strategy: native
  servlet:
    context-path: /

spring:
  application:
    name: thecreatestudio-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/the_create_studio}
    username: ${DB_USERNAME:tcs_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 2MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  # Public URL of the website — used to build client signing links in emails.
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:4200}
  company-name: TheCreateStudio
  owner-signer-name: ${APP_OWNER_SIGNER_NAME:TheCreateStudio}
  mail-from: ${MAIL_FROM:}
  jwt:
    # At least 32 characters. Generate one with:  openssl rand -base64 48
    secret: ${JWT_SECRET:}
    ttl-hours: ${JWT_TTL_HOURS:12}
  admin:
    # On first start, an admin account is created from these values if none exists.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    api-base: https://api.razorpay.com/v1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    in.thecreatestudio: INFO
